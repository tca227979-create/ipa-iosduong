name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reassemble Unity runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="Frameworks/UnityRuntime.framework/UnityRuntime"
          cat "${RUNTIME}.part"* > "$RUNTIME"
          chmod +x "$RUNTIME"
          ls -lh "$RUNTIME"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -o pipefail
          export TOOLCHAIN_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          export DT_TOOLCHAIN_DIR="$TOOLCHAIN_DIR"
          test -f "$TOOLCHAIN_DIR/usr/bin/clang++"
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            clean build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was produced."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload thegioihaitac.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: thegioihaitac-IPA
          path: ${{ runner.temp }}/ipa/thegioihaitac.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
