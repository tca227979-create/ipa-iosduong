name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble Large Static Libraries
        run: |
          echo "Reassembling libiPhone-lib.a..."
          cat Libraries/libiPhone-lib.a.part01 Libraries/libiPhone-lib.a.part02 Libraries/libiPhone-lib.a.part03 Libraries/libiPhone-lib.a.part04 Libraries/libiPhone-lib.a.part05 > Libraries/libiPhone-lib.a
          echo "Reassembling libil2cpp.a..."
          cat Libraries/libil2cpp.a.part01 Libraries/libil2cpp.a.part02 > Libraries/libil2cpp.a
          ls -lh Libraries/*.a

      - name: Build Xcode Project (Unsigned)
        run: |
          xcodebuild -version
          xcodebuild -project Unity-iPhone.xcodeproj \
                     -scheme Unity-iPhone \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r thegioihaitac.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thegioihaitac-IPA
          path: thegioihaitac.ipa
          retention-days: 14
