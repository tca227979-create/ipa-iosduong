workflows:
  unity-ios-build:
    name: Build Unity iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Reassemble split static libraries
        script: |
          cat Libraries/libiPhone-lib.a.part01 Libraries/libiPhone-lib.a.part02 Libraries/libiPhone-lib.a.part03 Libraries/libiPhone-lib.a.part04 Libraries/libiPhone-lib.a.part05 > Libraries/libiPhone-lib.a
          cat Libraries/libil2cpp.a.part01 Libraries/libil2cpp.a.part02 > Libraries/libil2cpp.a
          ls -lh Libraries/*.a
      - name: Build unsigned IPA
        script: |
          xcodebuild -version
          xcodebuild -project Unity-iPhone.xcodeproj \
                     -scheme Unity-iPhone \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Unity-iPhone.app Payload/
          cd Payload && zip -r ../thegioihaitac.ipa Unity-iPhone.app
    artifacts:
      - thegioihaitac.ipa
